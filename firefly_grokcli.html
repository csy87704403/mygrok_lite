<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>夏夜萤火虫</title>
<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0a1f3d;
}
svg {
  width: 100vw;
  height: 100vh;
  display: block;
}
</style>
</head>
<body>
<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- 深蓝夜空 -->
  <rect x="0" y="0" width="100%" height="100%" fill="#0a1f3d" />
  
  <!-- 草地 -->
  <rect x="0" y="780" width="1920" height="300" fill="#1e8b3e" />
  
  <!-- 星星闪烁 -->
  <circle cx="180" cy="110" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="520" cy="75" r="3" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="1.9s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="195" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="1250" cy="45" r="1.8" fill="#ffffff">
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1650" cy="240" r="3.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="90" cy="315" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="720" cy="410" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1420" cy="280" r="1.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="190" cy="620" r="2.8" fill="#ffffff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="680" r="1.7" fill="#ffffff">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="1520" cy="510" r="3" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="810" r="2.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="5.3s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="790" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="2.9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1720" cy="710" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite" />
  </circle>
  
  <!-- 萤火虫群组1 - 左下至右上曲线 -->
  <defs>
    <path id="p1" d="M 250 650 C 550 300 850 220 1250 480 C 1650 680 1850 520 2050 380" />
  </defs>
  <g transform="translate(250,650)">
    <circle r="38" fill="#ffeb3b" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="13" fill="#fff176" />
    <animateMotion path="#p1" dur="26s" repeatCount="indefinite" calcMode="linear" />
  </g>
  
  <!-- 萤火虫群组2 - 右下穿越中下曲线 -->
  <defs>
    <path id="p2" d="M 120 750 C 480 480 720 290 1150 170 C 1550 380 1820 610 2050 710" />
  </defs>
  <g transform="translate(650,740)">
    <circle r="38" fill="#ffeb3b" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="13" fill="#fff176" />
    <animateMotion path="#p2" dur="26s" repeatCount="indefinite" calcMode="linear" />
  </g>
  
  <!-- 萤火虫群组3 - 中段S形波动 -->
  <defs>
    <path id="p3" d="M 550 520 C 620 720 780 420 950 610 C 1120 510 1280 710 1450 460 C 1620 620 1780 380 1950 570" />
  </defs>
  <g transform="translate(680,480)">
    <circle r="32" fill="#ffeb3b" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="13" fill="#fff176" />
    <animateMotion path="#p3" dur="26s" repeatCount="indefinite" calcMode="linear" />
  </g>
  
  <!-- 萤火虫群组4 - 高处左上到右下 -->
  <defs>
    <path id="p4" d="M 900 320 C 1150 520 1280 280 1520 510 C 1750 680 1890 320 2050 480" />
  </defs>
  <g transform="translate(920,270)">
    <circle r="42" fill="#ffeb3b" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="13" fill="#fff176" />
    <animateMotion path="#p4" dur="26s" repeatCount="indefinite" calcMode="linear" />
  </g>
  
  <!-- 萤火虫群组5 - 右中低曲折向上 -->
  <defs>
    <path id="p5" d="M 1350 420 C 1420 650 1480 320 1550 580 C 1620 320 1680 620 1750 380 C 1800 650 1850 300 1950 570" />
  </defs>
  <g transform="translate(1380,430)">
    <circle r="32" fill="#ffeb3b" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="13" fill="#fff176" />
    <animateMotion path="#p5" dur="26s" repeatCount="indefinite" calcMode="linear" />
  </g>
</svg>
</body>
</html>
