<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SVG Bounce Ring</title>
<style>
body{margin:0;height:100vh;background:linear-gradient(#1e40af,#60a5fa);display:flex;justify-content:center;align-items:center}
svg{width:280px;height:280px;viewBox="0 0 280 280"}
#bg{fill:none}
.ball{animation:bounce 1.8s ease-in-out infinite}
.ring{animation:rotate 3.6s linear infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-95px)}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1e40af"/>
<stop offset="100%" stop-color="#60a5fa"/>
</linearGradient>
</defs>
<rect width="280" height="280" fill="url(#bg)"/>
<circle class="ring" cx="140" cy="140" r="115" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="18 9" stroke-linecap="round" opacity="0.75"/>
<circle class="ball" cx="140" cy="140" r="29" fill="#ef4444"/>
</svg>
</body>
</html>
