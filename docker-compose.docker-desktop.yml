# Grok 账号管理平台 - Windows / Docker Desktop 完整配置 (独立文件, 不用 override)
# 用法: docker compose -f docker-compose.docker-desktop.yml up -d
# 说明:
#   1. 平台与 mihomo 同网络 (compose 自动创建项目网络), 容器名 DNS 互访 (mihomo:8001)
#   2. 数据卷使用 named volumes (WSL2 ext4, 持久化更稳)
#   3. 端口 18080 映射到 Windows 浏览器

services:
  grok-platform:
    build: .
    container_name: grok-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GROK_ACCOUNTS_DIR: /root/grok_accounts
    volumes:
      - grok_accounts:/root/grok_accounts
      - platform_data:/app/data
      # cloakbrowser 浏览器二进制缓存 (~216MB): 不挂卷的话每次容器重建都要重新下载,
      # 下载源不稳会直接导致注册失败。挂卷后一次下载永久复用。
      - cloakbrowser_cache:/root/.cloakbrowser
      # 源码 bind mount: 让容器内代码始终同步 host 最新改动, 避免容器重建后 docker cp 的运行时改动丢失
      - ./main.py:/app/main.py
      - ./services:/app/services
      - ./static:/app/static
      - ./scripts:/app/scripts
    ports:
      - "18080:18080"
    depends_on:
      - mihomo
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Mihomo 代理节点容器 (与平台同网络, 平台通过 mihomo:8001 / 8100+ 真实节点访问)
  mihomo:
    image: metacubex/mihomo:latest
    container_name: mygrok-lite-mihomo
    restart: unless-stopped
    volumes:
      - ./mihomo:/root/.config/mihomo
    cap_add:
      - NET_ADMIN

volumes:
  grok_accounts:
    name: mygrok_lite_grok_accounts
  platform_data:
    name: mygrok_lite_platform_data
  cloakbrowser_cache:
    name: mygrok_lite_cloakbrowser_cache
