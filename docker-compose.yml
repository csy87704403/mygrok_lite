# Grok 账号管理平台 - docker-compose 部署 (Docker Desktop / WSL2 适配版)
# 关键差异 vs 原版:
#   1. network_mode: host -> bridge + ports 映射 (Docker Desktop 下 host 网络不会发布端口到 Windows)
#   2. Mihomo 也作为容器同网络运行 (复用 ymjc.cfd 订阅), 平台通过 mihomo:8001 访问节点
#   3. 数据卷使用 named volumes (存在 WSL2 VM ext4, 不跨 NTFS, 持久化更稳)
services:
  grok-platform:
    build: .
    container_name: grok-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 挂载卷路径 (与容器内一致)
      GROK_ACCOUNTS_DIR: /root/grok_accounts
    volumes:
      # 账号产出物 (CPA 等) - 持久化到 named volume (WSL2 ext4)
      - grok_accounts:/root/grok_accounts
      # 平台数据 (SQLite 数据库等) - 持久化到 named volume
      - platform_data:/app/data
    ports:
      # bridge 网络 + 端口映射: Windows 浏览器 localhost:18080 直达
      - "18080:18080"
    depends_on:
      - mihomo
    shm_size: "1gb"
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Mihomo 代理节点容器 (同网络, 平台通过 mihomo:8001 / socks5://mihomo:8002 访问)
  # 与平台同一 bridge 网络, 容器名 DNS 互访; 不发布端口到外部 (仅平台内部使用)
  mihomo:
    image: metacubex/mihomo:latest
    container_name: mygrok-lite-mihomo
    restart: unless-stopped
    volumes:
      - ./mihomo:/root/.config/mihomo
    cap_add:
      - NET_ADMIN
    # 不发布端口: 平台容器通过容器名访问 (mihomo:8001), 不需要暴露到 Windows

volumes:
  grok_accounts:
    name: mygrok_lite_grok_accounts
  platform_data:
    name: mygrok_lite_platform_data
