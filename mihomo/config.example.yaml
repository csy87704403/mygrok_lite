# Mihomo 配置 - mygrok_lite 平台专用 (自动生成, 幂等重建)
# 出口: 8100+ 每个真实节点一个独立端口 (平台节点池直接使用)
# 兜底: 8001 mixed / 8002 http -> REG_POOL round-robin 全池轮询

mixed-port: 8001
port: 8002
socks-port: 8003
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
secret: "change-me-mihomo-secret"

# 节点来源
proxy-providers:
  my_sub:
    type: http
    url: "https://your-subscribe-provider.com/api/v1/client/subscribe?token=YOUR_SUBSCRIBE_TOKEN"
    path: ./providers/my_sub.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
  local_nodes:
    type: file
    path: ./providers/local.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

proxy-groups:
  # 全池轮询兜底
  - name: REG_POOL
    type: load-balance
    use:
      - my_sub
      - local_nodes
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: false
    strategy: round-robin

  - name: FALLBACK
    type: select
    proxies:
      - REG_POOL
      - DIRECT

  # === 单节点固定出口 (自动生成) ===
  - name: NODE_8100
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇺🇸美国专线01' 
  - name: NODE_8101
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇺🇸美国专线02' 
  - name: NODE_8102
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇦🇺澳大利亚专线01' 
  - name: NODE_8103
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇦🇺澳大利亚专线02' 
  - name: NODE_8104
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇮🇳印度专线01' 
  - name: NODE_8105
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇮🇳印度专线02' 
  - name: NODE_8106
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇧🇷巴西专线01' 
  - name: NODE_8107
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇧🇷巴西专线02' 
  - name: NODE_8108
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇺🇸美国高速01' 
  - name: NODE_8109
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇺🇸美国高速02' 
  - name: NODE_8110
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇮🇳印度高速01' 
  - name: NODE_8111
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇦🇺澳大利亚高速01' 
  - name: NODE_8112
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇦🇺澳大利亚高速02' 
  - name: NODE_8113
    type: select
    use:
      - my_sub
      - local_nodes
    filter: '(?i)🇫🇷法国高速01' 
listeners:
  # === 每节点独立端口 (自动生成) ===
  - name: L8100
    type: mixed
    port: 8100
    listen: 0.0.0.0
    proxy: NODE_8100
  - name: L8101
    type: mixed
    port: 8101
    listen: 0.0.0.0
    proxy: NODE_8101
  - name: L8102
    type: mixed
    port: 8102
    listen: 0.0.0.0
    proxy: NODE_8102
  - name: L8103
